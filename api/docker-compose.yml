services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: cloxp-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: clox
      POSTGRES_PASSWORD: clox
      POSTGRES_DB: clox_prelaunch
    volumes:
      - clox_pg_data:/var/lib/postgresql/data
      - ./init/01-postgis.sql:/docker-entrypoint-initdb.d/01-postgis.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U clox -d clox_prelaunch']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  clox_pg_data:
